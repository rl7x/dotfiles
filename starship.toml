# Clean, font-safe prompt for Apple Terminal.
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"
command_timeout = 500

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " ro"

[git_branch]
format = "[$branch]($style) "
style = "purple"

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "!"
ahead = "+${count}"
behind = "-${count}"
diverged = "+${ahead_count}/-${behind_count}"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = "r"
deleted = "x"

[cmd_duration]
min_time = 2000
format = "[${duration}]($style) "
style = "dimmed white"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"
